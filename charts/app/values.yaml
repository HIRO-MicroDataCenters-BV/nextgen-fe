replicaCount: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  containerPort: 3000

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

nodeSelector:
  role: hus

namespace: nextgen

ingress:
  host: nextgen.hiro-develop.nl

backend:
  catalogName: "hus_catalog"
  searchServiceURL: https://ds-gateway.uva.nextgen.hiro-develop.nl/search
  catalogServiceURL: https://ds-gateway.ki.nextgen.hiro-develop.nl/catalog
  connectorServiceURL: https://ds-connector.hus.nextgen.hiro-develop.nl/dataproducts
  trainingBuilderServiceURL: https://dashboard.cog.hiro-develop.nl/apidev
  cogURL: https://dashboard.cog.hiro-develop.nl/uidev
  apiCogURL: https://dashboard.cog.hiro-develop.nl/apidev
