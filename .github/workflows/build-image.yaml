name: Build and push docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
    paths-ignore:
      - "releases/**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: hiro-microdatacenters-bv/nextgen-fe
  NUXT_PUBLIC_API_SEARCH_SERVICE_URL: ${{ vars.NUXT_PUBLIC_API_SEARCH_SERVICE_URL }}
  NUXT_PUBLIC_API_CATALOG_SERVICE_URL: ${{ vars.NUXT_PUBLIC_API_CATALOG_SERVICE_URL }}
  NUXT_PUBLIC_API_CONNECTOR_SERVICE_URL: ${{ vars.NUXT_PUBLIC_API_CONNECTOR_SERVICE_URL }}
  NUXT_PUBLIC_COG_URL: ${{ vars.NUXT_PUBLIC_COG_URL }}
  NUXT_PUBLIC_API_COG_URL: ${{ vars.NUXT_PUBLIC_API_COG_URL }}
  NUXT_PUBLIC_CATALOG_NAME: ${{ vars.NUXT_PUBLIC_CATALOG_NAME }}

jobs:
  build:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make versions
        run: |
          cd "${{ github.workspace }}"
          chmod +x ./tools/version.sh
          ./tools/version.sh "${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}"
          echo "VERSION_APP=$(cat "./VERSION_APP")" >> $GITHUB_ENV
          echo "DOCKER_IMAGES=$(cat "./DOCKER_IMAGES")" >> $GITHUB_ENV
          echo "DOCKER_TAGS=$(cat "./VERSION_DOCKER")" >> $GITHUB_ENV
          echo "VERSION_CHART=$(cat "./VERSION_CHART")" >> $GITHUB_ENV

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: ${{ env.DOCKER_TAGS }}

      - name: Push docker image with version
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.DOCKER_IMAGES }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64, linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NUXT_PUBLIC_APP_VERSION: ${{ env.VERSION_APP }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Create a github release
        run: gh release create "${{ env.VERSION_APP }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish Helm charts
        uses: stefanprodan/helm-gh-pages@master
        with:
          token: ${{ github.token }}
          target_dir: "./helm-charts/"

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Chart version"
            echo
            echo '```'
            echo "${VERSION_CHART}"
            echo '```'
            echo
            echo "Paste that into \`version:\` in the service's \`fleet.yaml\` in **ds-gitops**."
            echo
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "> **Do not deploy this one.** It is a \`pull_request\` build, made from a"
              echo "> temporary merge commit that exists on no branch. Use the \`push\` run"
              echo "> of the same commit instead."
              echo
            fi
            echo "| | |"
            echo "|---|---|"
            echo "| branch | \`${GITHUB_REF_NAME}\` |"
            echo "| event | \`${GITHUB_EVENT_NAME}\` |"
            echo "| commit | \`${GITHUB_SHA}\` |"
            echo "| image | \`${DOCKER_IMAGES}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
